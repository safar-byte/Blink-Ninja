<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Eye Open Time Tracker</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a, #020617);
      color: #e5e7eb;
    }
    h1 {
      margin-top: 32px;
      margin-bottom: 8px;
      font-size: 1.8rem;
      text-align: center;
    }
    p.subtitle {
      margin: 0 16px 24px;
      text-align: center;
      color: #9ca3af;
      max-width: 480px;
      font-size: 0.95rem;
    }
    #container {
      background: rgba(15, 23, 42, 0.95);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: 90%;
      max-width: 640px;
    }
    #video-wrapper {
      position: relative;
      width: 100%;
      max-width: 640px;
      border-radius: 12px;
      overflow: hidden;
      background: #020617;
    }
    video, canvas {
      width: 100%;
      height: auto;
      display: block;
    }
    #overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    #controls {
      display: flex;
      gap: 12px;
      margin-top: 4px;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      border: none;
      border-radius: 999px;
      padding: 10px 20px;
      font-size: 0.95rem;
      cursor: pointer;
      font-weight: 600;
      letter-spacing: 0.02em;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.15s ease;
    }
    button.primary {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #022c22;
      box-shadow: 0 8px 18px rgba(34,197,94,0.35);
    }
    button.primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 22px rgba(34,197,94,0.45);
    }
    button.secondary {
      background: #111827;
      color: #e5e7eb;
      border: 1px solid #374151;
    }
    button.secondary:hover {
      background: #020617;
    }
    button:disabled {
      opacity: 0.4;
      cursor: default;
      transform: none;
      box-shadow: none;
    }
    #status {
      font-size: 0.9rem;
      color: #9ca3af;
      text-align: center;
      min-height: 1.2em;
    }
    #metrics {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 4px;
      font-size: 0.95rem;
    }
    .metric {
      background: #020617;
      border-radius: 999px;
      padding: 6px 14px;
      display: inline-flex;
      align-items: baseline;
      gap: 4px;
      border: 1px solid #1e293b;
    }
    .metric-label {
      color: #9ca3af;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .metric-value {
      font-weight: 600;
      color: #e5e7eb;
      font-variant-numeric: tabular-nums;
    }
    .eye-state-open {
      color: #22c55e;
    }
    .eye-state-closed {
      color: #f97316;
    }
    a.small-link {
      margin-top: 12px;
      font-size: 0.75rem;
      color: #6b7280;
      text-decoration: none;
    }
    a.small-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>Eye Open Time Tracker</h1>
  <p class="subtitle">
    Click <strong>Start</strong>, look at the camera, and keep your eyes open.
    When you blink or close your eyes, the total open time will be shown.
  </p>

  <div id="container">
    <div id="video-wrapper">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="overlay"></canvas>
    </div>

    <div id="controls">
      <button id="startBtn" class="primary">▶ Start</button>
      <button id="resetBtn" class="secondary" disabled>↺ Reset</button>
    </div>

    <div id="status"></div>

    <div id="metrics">
      <div class="metric">
        <span class="metric-label">Eye State</span>
        <span id="eyeState" class="metric-value">–</span>
      </div>
      <div class="metric">
        <span class="metric-label">Open Time</span>
        <span id="openTime" class="metric-value">0.000 s</span>
      </div>
    </div>
  </div>

  <!-- MediaPipe FaceMesh + camera utils -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>

  <script>
    const video = document.getElementById('video');
    const overlay = document.getElementById('overlay');
    const ctx = overlay.getContext('2d');

    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');
    const statusEl = document.getElementById('status');
    const eyeStateEl = document.getElementById('eyeState');
    const openTimeEl = document.getElementById('openTime');

    let camera = null;
    let faceMesh = null;
    let measuring = false;
    let openStartTime = null;
    let totalOpenMs = 0;
    let eyeJustClosed = false;

    // EAR threshold: tune if needed (higher = easier to mark as closed)
    // Try 0.26 first; you can adjust between ~0.22–0.30 depending on your face/camera.
    const EAR_THRESHOLD = 0.26;
    // Number of consecutive frames required for a stable open/closed state.
    // Set to 1 so quick blinks are still caught.
    const STABILITY_FRAMES = 1;
    let lastEarState = null;
    let stableCount = 0;

    function formatSeconds(ms) {
      return (ms / 1000).toFixed(3) + ' s';
    }

    function setEyeState(isOpen) {
      if (isOpen) {
        eyeStateEl.textContent = 'Open';
        eyeStateEl.classList.add('eye-state-open');
        eyeStateEl.classList.remove('eye-state-closed');
      } else {
        eyeStateEl.textContent = 'Closed';
        eyeStateEl.classList.add('eye-state-closed');
        eyeStateEl.classList.remove('eye-state-open');
      }
    }

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function resetMeasurement() {
      measuring = false;
      openStartTime = null;
      totalOpenMs = 0;
      eyeJustClosed = false;
      lastEarState = null;
      stableCount = 0;
      openTimeEl.textContent = '0.000 s';
      eyeStateEl.textContent = '–';
      eyeStateEl.classList.remove('eye-state-open', 'eye-state-closed');
      setStatus('Click Start to begin.');
    }

    function eyeAspectRatio(p1, p2, p3, p4, p5, p6) {
      const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
      const vertical1 = dist(p2, p6);
      const vertical2 = dist(p3, p5);
      const horizontal = dist(p1, p4);
      return (vertical1 + vertical2) / (2.0 * horizontal);
    }

    function getEarFromLandmarks(landmarks) {
      const L = [
        landmarks[33],
        landmarks[159],
        landmarks[158],
        landmarks[133],
        landmarks[153],
        landmarks[144],
      ];
      const leftEAR = eyeAspectRatio(L[0], L[1], L[2], L[3], L[4], L[5]);

      const R = [
        landmarks[362],
        landmarks[386],
        landmarks[387],
        landmarks[263],
        landmarks[373],
        landmarks[380],
      ];
      const rightEAR = eyeAspectRatio(R[0], R[1], R[2], R[3], R[4], R[5]);

      return (leftEAR + rightEAR) / 2;
    }

    function drawEyes(landmarks) {
      const eyeIndices = [33, 159, 158, 133, 153, 144, 362, 386, 387, 263, 373, 380];
      ctx.clearRect(0, 0, overlay.width, overlay.height);
      ctx.lineWidth = 2;
      ctx.strokeStyle = 'rgba(34,197,94,0.9)';
      ctx.beginPath();
      eyeIndices.forEach((i, idx) => {
        const pt = landmarks[i];
        const x = pt.x * overlay.width;
        const y = pt.y * overlay.height;
        if (idx === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();
    }

    function onResults(results) {
      if (!measuring) return;

      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        const landmarks = results.multiFaceLandmarks[0];

        if (overlay.width !== video.videoWidth || overlay.height !== video.videoHeight) {
          overlay.width = video.videoWidth;
          overlay.height = video.videoHeight;
        }

        drawEyes(landmarks);

        const ear = getEarFromLandmarks(landmarks);
        const isOpenNow = ear > EAR_THRESHOLD;

        if (lastEarState === null) {
          lastEarState = isOpenNow;
          stableCount = 1;
        } else if (isOpenNow === lastEarState) {
          stableCount++;
        } else {
          stableCount = 1;
          lastEarState = isOpenNow;
        }

        if (stableCount >= STABILITY_FRAMES) {
          setEyeState(isOpenNow);

          const now = performance.now();

          if (isOpenNow) {
            if (!openStartTime) {
              openStartTime = now;
              setStatus('Tracking eye open time...');
            } else {
              totalOpenMs = now - openStartTime;
              openTimeEl.textContent = formatSeconds(totalOpenMs);
            }
          } else if (openStartTime && !eyeJustClosed) {
            eyeJustClosed = true;
            measuring = false;
            totalOpenMs = now - openStartTime;
            openTimeEl.textContent = formatSeconds(totalOpenMs);
            setStatus('Eyes closed detected. Total open time: ' + formatSeconds(totalOpenMs));
            startBtn.disabled = true;
            resetBtn.disabled = false;
          }
        }
      } else {
        ctx.clearRect(0, 0, overlay.width, overlay.height);
        setStatus('Face not detected. Please look at the camera.');
      }
    }

    async function initFaceMesh() {
      return new Promise((resolve) => {
        // In the browser build, FaceMesh is exposed as a global constructor
        faceMesh = new FaceMesh({
          locateFile: (file) =>
            `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`,
        });
        faceMesh.setOptions({
          maxNumFaces: 1,
          refineLandmarks: true,
          minDetectionConfidence: 0.6,
          minTrackingConfidence: 0.6,
        });
        faceMesh.onResults(onResults);
        resolve();
      });
    }

    async function startCameraAndTracking() {
      setStatus('Initializing camera and model...');
      startBtn.disabled = true;
      resetBtn.disabled = true;

      if (!faceMesh) {
        await initFaceMesh();
      }

      camera = new Camera(video, {
        onFrame: async () => {
          await faceMesh.send({ image: video });
        },
        width: 640,
        height: 480,
      });

      await camera.start();
      measuring = true;
      openStartTime = null;
      totalOpenMs = 0;
      eyeJustClosed = false;
      lastEarState = null;
      stableCount = 0;

      setStatus('Camera on. Keep your eyes open and look at the camera.');
      resetBtn.disabled = false;
    }

    function stopCamera() {
      if (camera) {
        camera.stop();
        camera = null;
      }
    }

    startBtn.addEventListener('click', async () => {
      try {
        await startCameraAndTracking();
      } catch (err) {
        console.error(err);
        setStatus('Error starting camera: ' + err.message);
        startBtn.disabled = false;
      }
    });

    resetBtn.addEventListener('click', () => {
      stopCamera();
      resetMeasurement();
      startBtn.disabled = false;
      resetBtn.disabled = true;
      ctx.clearRect(0, 0, overlay.width, overlay.height);
    });

    resetMeasurement();
  </script>
</body>
</html>
